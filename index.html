<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тайм-кард / Timecard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: Arial, sans-serif; padding: 20px; padding-top: 80px; margin: 0; padding-bottom: 60px;}
        .header-bar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; margin-bottom: 20px; }
        h2 { color: #da291c; margin: 0; font-size: 1.3em; }
        .lang-switch { display: flex; gap: 5px; }
        .lang-btn { background: #222; color: #888; border: 1px solid #444; padding: 6px 10px; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: bold; width: auto; margin-top: 0; }
        .lang-btn.active { background: #da291c; color: #fff; border-color: #da291c; }
        label { display: block; margin-top: 15px; font-size: 14px; color: #ccc; }
        input, select, button { width: 100%; padding: 12px; margin-top: 5px; box-sizing: border-box; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; font-size: 16px; }
        input[type="time"] { appearance: none; }
        input:focus, select:focus { outline: none; border-color: #da291c; }
        
        .tracker-block { background: #2a2a2a; border-left: 4px solid #d4af37; padding: 12px 15px; margin-top: 20px; margin-bottom: 5px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; }
        .tracker-label { font-size: 14px; font-weight: bold; color: #e0e0e0; }
        .tracker-time { font-size: 1.25em; font-weight: bold; color: #d4af37; }
        
        .recent-tasks-container { display: flex; overflow-x: auto; gap: 8px; margin-top: 8px; padding-bottom: 5px; -ms-overflow-style: none; scrollbar-width: none; }
        .recent-tasks-container::-webkit-scrollbar { display: none; }
        .recent-task-pill { background: #333; color: #ddd; padding: 6px 12px; border-radius: 15px; font-size: 13px; cursor: pointer; white-space: nowrap; border: 1px solid #444; }
        .recent-task-pill:active { background: #da291c; border-color: #da291c; color: white; }

        .time-inputs-wrapper { display: flex; gap: 10px; margin-top: 5px; }
        .time-box { flex: 1; }
        .time-box label { margin-top: 10px; font-size: 12px; color: #aaa; }
        .time-box input { margin-top: 5px; }

        .action-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .add-btn { grid-column: span 2; background-color: #da291c; color: white; font-weight: bold; border: none; cursor: pointer; transition: background-color 0.2s; margin-top: 0; }
        .add-btn:active { background-color: #b52217; }
        .add-btn:disabled { background-color: #555; color: #888; cursor: not-allowed; }
        .add-btn.edit-mode { background-color: #d4af37; color: #000; }
        .quick-btn { background-color: #333; color: #ddd; border: 1px solid #555; font-weight: bold; cursor: pointer; transition: background-color 0.2s; white-space: nowrap; margin-top: 0; display: flex; justify-content: center; align-items: center; padding: 12px 5px; }
        .quick-btn:active { background-color: #555; }
        
        .task-list { margin-top: 25px; }
        .day-group { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 4px solid #da291c; }
        .day-title { color: #da291c; margin: 0 0 10px 0; font-size: 1.1em; border-bottom: 1px solid #333; padding-bottom: 8px; }
        .main-task-group { background: #2a2a2a; border-radius: 6px; margin-bottom: 12px; padding: 10px; border: 1px solid transparent; }
        .main-task-group.unpaid-group { background: #181818; border: 1px dashed #555; border-left: 4px solid #555; opacity: 0.8; }
        .unpaid-tag { font-size: 0.7em; color: #aaa; border: 1px solid #555; padding: 2px 5px; border-radius: 4px; margin-left: 8px; vertical-align: middle; text-transform: uppercase; }
        .main-task-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #444; padding-bottom: 8px; margin-bottom: 8px; }
        .main-task-name { font-size: 1.05em; font-weight: bold; color: #e0e0e0; word-break: break-word; }
        .main-task-total { color: #da291c; font-weight: bold; white-space: nowrap; margin-left: 10px; }
        .unpaid-group .main-task-total { color: #777; }
        .sub-task-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #444; }
        .sub-task-item:last-of-type { border-bottom: none; }
        .sub-task-name { flex-grow: 1; color: #bbb; font-size: 0.95em; padding-right: 10px; word-break: break-word; }
        .task-controls { display: flex; align-items: center; gap: 8px; white-space: nowrap; }
        .task-hours { font-weight: bold; color: #fff; margin-right: 5px; }
        .icon-btn { background-color: #333; border: none; border-radius: 4px; width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; cursor: pointer; margin: 0; padding: 0; font-size: 16px; }
        .edit-btn { color: #d4af37; }
        .delete-btn { color: #da291c; }
        .icon-btn:active { background-color: #555; }
        .add-sub-btn { background: transparent; border: 1px dashed #555; color: #aaa; width: 100%; padding: 8px; margin-top: 10px; border-radius: 4px; cursor: pointer; text-align: center; font-size: 14px; transition: all 0.2s; }
        .add-sub-btn:active { border-color: #da291c; color: #da291c; background: #333; }
        
        .total-hours { font-weight: bold; margin-top: 15px; color: #aaa; text-align: right; border-top: 1px solid #444; padding-top: 10px; }
        .weekly-total { text-align: center; font-size: 1.1em; color: #fff; margin-top: 20px; padding: 12px; background: #1e1e1e; border-radius: 8px; border: 1px solid #da291c; font-weight: bold; }
        .archive-total { text-align: center; font-size: 0.95em; color: #ccc; margin-top: 10px; padding: 12px; background: #1a1a1a; border-radius: 8px; border: 1px solid #333; cursor: pointer; }
        .archive-total:active { background: #222; }
        .archive-number { font-weight: bold; color: #4CAF50; }
        .archive-date { font-size: 0.85em; margin-top: 4px; }
        .empty-day { text-align: center; color: #777; margin-top: 30px; margin-bottom: 20px; }
        
        /* Кнопки экспорта и сброса */
        .export-btn { background-color: #2196F3; color: white; margin-top: 30px; border: none; cursor: pointer; font-weight: bold; }
        .export-btn:active { background-color: #1976D2; }
        .reset-btn { background-color: #444; color: #ccc; margin-top: 15px; border: none; cursor: pointer; }
        .reset-btn:active { background-color: #333; }
        .reset-btn:disabled { background-color: #222; color: #555; cursor: not-allowed; }
        
        .user-id-block { text-align: center; margin-top: 30px; color: #666; font-size: 0.85em; cursor: pointer; padding: 10px; border-top: 1px dashed #333; }

        /* Стили окна экспорта */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.95); z-index: 1000; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; padding: 20px; box-sizing: border-box; }
        .modal-content { background: #181818; width: 100%; max-width: 500px; border-radius: 12px; padding: 20px; border: 1px solid #333; margin-top: 20px; margin-bottom: 20px; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .modal-header h3 { margin: 0; color: #fff; font-size: 1.4em; }
        .close-btn { background: transparent; border: none; color: #888; font-size: 24px; cursor: pointer; padding: 0; margin: 0; width: auto; height: auto; display: inline; }
        .close-btn:active { color: #fff; }
        .export-body { color: #ddd; font-size: 15px; line-height: 1.4; }
        .exp-day { margin-bottom: 20px; border-left: 4px solid #da291c; padding-left: 15px; }
        .exp-day-title { color: #da291c; font-weight: bold; margin-bottom: 8px; font-size: 1.2em; text-transform: uppercase; letter-spacing: 0.5px; }
        .exp-task { margin-bottom: 10px; }
        .exp-task-name { font-weight: bold; color: #fff; font-size: 1.05em; margin-bottom: 4px; }
        .exp-sub { display: flex; justify-content: space-between; margin-left: 10px; color: #bbb; border-bottom: 1px dashed #333; padding: 4px 0; }
        .exp-sub:last-child { border-bottom: none; }
        .exp-total { text-align: center; font-weight: bold; color: #4CAF50; margin-top: 25px; font-size: 1.3em; border-top: 2px solid #333; padding-top: 15px; background: #222; border-radius: 8px; padding-bottom: 15px; border: 1px solid #4CAF50; }
        .exp-unpaid { color: #777; font-size: 0.9em; }
    </style>
</head>
<body>

    <div class="header-bar">
        <h2 id="appTitle">Робочий табель</h2>
        <div class="lang-switch">
            <button class="lang-btn" id="btn-uk" onclick="setLanguage('uk')">UA</button>
            <button class="lang-btn" id="btn-en" onclick="setLanguage('en')">EN</button>
            <button class="lang-btn" id="btn-ru" onclick="setLanguage('ru')">RU</button>
        </div>
    </div>
    
    <label for="daySelect" id="labelDay">День тижня:</label>
    <select id="daySelect" onchange="renderTasks()"></select>

    <label for="shiftStartInput" id="labelShiftStart">Початок зміни:</label>
    <input type="time" id="shiftStartInput" onchange="saveShiftStart()">

    <div class="tracker-block">
        <span class="tracker-label" id="labelTracker">Час за табелем:</span>
        <span class="tracker-time" id="trackerTime">07:00</span>
    </div>

    <label for="taskInput" id="labelTask">Що робив? (Головна робота)</label>
    <input type="text" id="taskInput">
    <div id="recentTasks" class="recent-tasks-container"></div>

    <label for="subTaskInput" id="labelSubTask">Деталі / Підгрупа (необов'язково):</label>
    <input type="text" id="subTaskInput">

    <div class="time-inputs-wrapper">
        <div class="time-box">
            <label for="endTimeInput" id="labelEndTime">О котрій закінчив?</label>
            <input type="time" id="endTimeInput" onchange="calculateHoursFromTime()">
        </div>
        <div class="time-box">
            <label for="hoursInput" id="labelHours">Або години (0.5, 1):</label>
            <input type="number" id="hoursInput" step="0.25" min="0.01">
        </div>
    </div>

    <div class="action-buttons">
        <button class="add-btn" id="addBtn" onclick="addOrUpdateTask()">Додати запис</button>
        <button class="quick-btn" id="breakBtn" onclick="addQuickBreak()">☕ Перерва (0.5)</button>
        <button class="quick-btn" id="lunchBtn" onclick="addQuickLunch()">🍔 Ланч (0.5)</button>
    </div>

    <div class="task-list" id="taskList"></div>
    <div class="weekly-total" id="weeklyTotal" style="display: none;"></div>
    
    <div class="archive-total" id="archiveBlock" onclick="editArchiveSettings()">
        <div><span id="labelArchive">Стаж за весь час:</span> <span class="archive-number" id="archiveTime">0</span> <span id="labelArchiveUnit">год.</span></div>
        <div class="archive-date" id="archiveDateDisplay"></div>
    </div>

    <button class="export-btn" id="exportBtn" onclick="openExportModal()">📸 Експорт (Скріншот)</button>
    <button class="reset-btn" id="resetBtn" onclick="resetData()">Скинути все (для нового тижня)</button>

    <div class="user-id-block" onclick="changeUserId()">
        👤 <span id="labelProfile">Профіль / ID:</span> <span id="userIdDisplay" style="color: #bbb; font-weight: bold;"></span>
    </div>

    <!-- Модальное окно для экспорта -->
    <div id="exportModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="exportTitle">Звіт за тиждень</h3>
                <button class="close-btn" onclick="closeExportModal()">✕</button>
            </div>
            <div id="exportBody" class="export-body">
                <!-- Контент генерируется скриптом -->
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_WEB_APP_URL = "https://script.google.com/macros/s/AKfycby3yGb7NblLKLLRV9sjBpNhY3Zj8W6AJoGbqRWJ2gwObmvS8DnETZvWPXViaiR7QNG8Lw/exec"; 

        const i18n = {
            uk: {
                title: "Робочий табель", dayLabel: "День тижня:", days: ["Понеділок", "Вівторок", "Середа", "Четвер", "П'ятниця", "Субота", "Неділя"],
                shiftStartLabel: "Початок зміни:", trackerLabel: "Час за табелем:", taskLabel: "Що робив? (Головна робота)",
                taskPlaceholder: "Наприклад: Боксінг, Прокладка кабелю", subTaskLabel: "Деталі / Підгрупа (необов'язково):", subTaskPlaceholder: "Наприклад: 1 поверх, кімната 2",
                endTimeLabel: "О котрій закінчив?", hoursLabel: "Або години (0.5, 1):",
                addBtn: "Додати запис", saveBtn: "Зберегти зміни", breakBtn: "☕ Перерва (0.5)",
                breakName: "Перерва", lunchBtn: "🍔 Ланч (0.5)", lunchName: "Ланч", unpaidLabel: "неоплач.", unpaidTag: "НЕОПЛАЧ.",
                addSubBtn: "+ Додати сюди", noSubDetails: "Основна робота", totalDay: "Усього за день (оплачується):", weeklyTotal: "Разом за тиждень (оплачується):",
                archiveLabel: "Стаж за весь час:", archiveSince: "з", archivePromptHint: "натисни, щоб встановити дату",
                editArchivePrompt: "Введи загальну кількість годин за весь час:", editDatePrompt: "Введи дату початку (у форматі ДД.ММ.РРРР):",
                noTasks: "Немає записів на цей день", resetBtn: "Скинути все (для нового тижня)", alertNoDesc: "Будь ласка, напиши, що ти робив.", alertNoHours: "Вкажи коректний час або години.",
                confirmReset: "Видалити всі записи за тиждень? Дані підуть у Google Таблицю.", sending: "Відправка в таблицю... ⏳", sendSuccess: "Успішно! Дані збережено в хмару.",
                emptyError: "Табель порожній.", unit: "год.",
                profileLabel: "Профіль / ID:", changeIdPrompt: "Введіть свій ID (якщо змінили телефон або браузер):",
                exportBtn: "📸 Експорт (Скріншот)", exportTitle: "Звіт за тиждень", together: "Разом"
            },
            en: {
                title: "Work Timecard", dayLabel: "Day of the week:", days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
                shiftStartLabel: "Shift start:", trackerLabel: "Current tracked time:", taskLabel: "Main Task:", taskPlaceholder: "E.g.: Boxing, Pulling wire",
                subTaskLabel: "Details / Sub-group (optional):", subTaskPlaceholder: "E.g.: 1st floor, room 2", 
                endTimeLabel: "Time finished?", hoursLabel: "Or hours (0.5, 1):",
                addBtn: "Add entry", saveBtn: "Save changes", breakBtn: "☕ Break (0.5)", breakName: "Break", lunchBtn: "🍔 Lunch (0.5)", lunchName: "Lunch",
                unpaidLabel: "unpaid", unpaidTag: "UNPAID", addSubBtn: "+ Add here", noSubDetails: "Main work", totalDay: "Total for day (paid):",
                weeklyTotal: "Weekly total (paid):", archiveLabel: "All-time total:", archiveSince: "since", archivePromptHint: "click to set start date",
                editArchivePrompt: "Enter total all-time hours:", editDatePrompt: "Enter start date (e.g. DD.MM.YYYY):",
                noTasks: "No entries for this day", resetBtn: "Reset all (for new week)", alertNoDesc: "Please describe what you did.", alertNoHours: "Enter valid time or hours.",
                confirmReset: "Delete all entries for the week? Data will be sent to Google Sheets.", sending: "Sending to Sheets... ⏳", sendSuccess: "Success! Data saved to cloud.",
                emptyError: "Timecard is empty.", unit: "hrs",
                profileLabel: "Profile / ID:", changeIdPrompt: "Enter your ID (if you changed phone/browser):",
                exportBtn: "📸 Export (Screenshot)", exportTitle: "Weekly Summary", together: "Total"
            },
            ru: {
                title: "Рабочий табель", dayLabel: "День недели:", days: ["Понедельник", "Вторник", "Среда", "Четверг", "Пятница", "Суббота", "Воскресенье"],
                shiftStartLabel: "Начало смены:", trackerLabel: "Время по табелю:", taskLabel: "Что делал? (Главная работа)",
                taskPlaceholder: "Например: Боксинг, Протяжка", subTaskLabel: "Детали / Подгруппа (необязательно):", subTaskPlaceholder: "Например: 1 этаж, комната",
                endTimeLabel: "Во сколько закончил?", hoursLabel: "Или часы (0.5, 1):",
                addBtn: "Добавить запись", saveBtn: "Сохранить изменения", breakBtn: "☕ Перерыв (0.5)",
                breakName: "Перерыв", lunchBtn: "🍔 Ланч (0.5)", lunchName: "Ланч", unpaidLabel: "неоплач.", unpaidTag: "НЕОПЛАЧ.", addSubBtn: "+ Добавить сюда",
                noSubDetails: "Основная работа", totalDay: "Итого за день (оплачивается):", weeklyTotal: "Всего за неделю (оплачивается):",
                archiveLabel: "Стаж за всё время:", archiveSince: "с", archivePromptHint: "нажми, чтобы установить дату",
                editArchivePrompt: "Введи общую сумму часов за всё время:", editDatePrompt: "Введи дату начала (в формате ДД.ММ.ГГГГ):",
                noTasks: "Нет записей на этот день", resetBtn: "Сбросить всё (для новой недели)", alertNoDesc: "Пожалуйста, напиши, что ты делал.", alertNoHours: "Укажи корректное время или часы.",
                confirmReset: "Удалить все записи за неделю? Данные уйдут в Google Таблицу.", sending: "Отправка в таблицу... ⏳", sendSuccess: "Успешно! Данные сохранены в облако.",
                emptyError: "Табель пуст.", unit: "ч.",
                profileLabel: "Профиль / ID:", changeIdPrompt: "Введите свой ID (если сменили телефон или браузер):",
                exportBtn: "📸 Экспорт (Скриншот)", exportTitle: "Отчет за неделю", together: "Итого"
            }
        };

        let appUserId = localStorage.getItem('timecard_appUserId');
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
            appUserId = "tg_" + window.Telegram.WebApp.initDataUnsafe.user.id;
            localStorage.setItem('timecard_appUserId', appUserId);
        } else if (!appUserId) {
            appUserId = "web_" + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('timecard_appUserId', appUserId);
        }
        document.getElementById('userIdDisplay').textContent = appUserId;

        let currentLang = localStorage.getItem('timecardLang') || 'uk';
        let timecardData = JSON.parse(localStorage.getItem('timecardGroupedData')) || {};
        let shiftStart = localStorage.getItem('timecardShiftStart') || '07:00';
        document.getElementById('shiftStartInput').value = shiftStart;
        
        let archiveHours = 0;
        let archiveStartDate = "";
        let editingDay = null, editingMainTask = null, editingSubIdx = null, editingUnpaid = false;

        function getCurrentDayIndex() {
            const today = new Date().getDay();
            return (today === 0 ? 6 : today - 1).toString();
        }

        function changeUserId() {
            const t = i18n[currentLang];
            let newId = prompt(t.changeIdPrompt, appUserId);
            if (newId && newId.trim() !== "") {
                appUserId = newId.trim();
                localStorage.setItem('timecard_appUserId', appUserId);
                document.getElementById('userIdDisplay').textContent = appUserId;
                syncWithCloud(); 
            }
        }

        function formatDisplayDate(dateStr) {
            if (!dateStr) ret
